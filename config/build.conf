# Lightning Linux Build Configuration
# Part of HarshitOS / Lightning Linux project
# https://github.com/jainh2095-sudo/Linux

# ==========================================
# GENERAL CONFIGURATION
# ==========================================

[General]
DISTRO_NAME="Lightning Linux"
DISTRO_VERSION="0.1"
DISTRO_CODENAME="Harshit"
ARCHITECTURE="x86_64"
BUILD_DATE="2024-07-31"
BUILD_TIME="00:00:00"
MAINTAINER="Harshit Jain (jainh2095-sudo)"
HOMEPAGE="https://github.com/jainh2095-sudo/Linux"

# ==========================================
# KERNEL CONFIGURATION
# ==========================================

[Kernel]
KERNEL_VERSION="6.1.85"
KERNEL_CONFIG="config/kernel/config-x86_64"
KERNEL_PATCHES="patches/kernel"
KERNEL_COMPRESSION="xz"
KERNEL_FLAVOR="generic"

# Custom kernel patches
# Available: ck, pf, tkg, zen
KERNEL_PATCHSET="none"

# Kernel boot parameters
KERNEL_CMDLINE="quiet splash zswap.enabled=1 zswap.compressor=lz4 zswap.max_pool_percent=20 zswap.accept_throttled_writebacks=1 mitigations=off nowatchdog"

# ==========================================
# INIT SYSTEM CONFIGURATION
# ==========================================

[Init]
# Available: openrc, systemd
INIT_SYSTEM="openrc"

# OpenRC settings
OPENRC_PARALLEL="YES"
OPENRC_LOGGER="NO"
OPENRC_DEPEND_STRICT="NO"

# systemd settings
SYSTEMD_DEFAULT_TARGET="graphical.target"
SYSTEMD_LOG_LEVEL="warning"

# ==========================================
# LIBC CONFIGURATION
# ==========================================

[LibC]
# Available: glibc, musl
LIBC_IMPLEMENTATION="glibc"

# musl settings
MUSL_VERSION="1.2.4"
MUSL_OPTIMIZATIONS="-Os -pipe -fomit-frame-pointer"

# ==========================================
# DESKTOP ENVIRONMENT CONFIGURATION
# ==========================================

[Desktop]
# Available: xfce4, openbox, lxqt, none
DESKTOP_ENVIRONMENT="xfce4"

# Display Manager
# Available: lightdm, sddm, gdm3, none
DISPLAY_MANAGER="lightdm"

# Window Manager
# Available: picom, compton, none
WINDOW_MANAGER="picom"

# Window Manager settings
PICOM_BACKEND="glx"
PICOM_VSYNC="true"
PICOM_COMPOSITING_CACHE="true"
PICOM_SHADOW="true"
PICOM_SHADOW_RADIUS="8"
PICOM_SHADOW_OPACITY="0.5"

# ==========================================
# PERFORMANCE OPTIMIZATIONS
# ==========================================

[Optimizations]
# Memory optimizations
ENABLE_ZRAM="yes"
ZRAM_SIZE_PERCENT="50"
ZRAM_COMPRESSION="lz4"
ZRAM_NUM_DEVICES="1"

ENABLE_ZSWAP="yes"
ZSWAP_COMPRESSOR="lz4"
ZSWAP_MAX_POOL_PERCENT="20"
ZSWAP_ACCEPT_THROTTLED_WRITEBACKS="1"

ENABLE_THP="yes"
THP_ENABLED="1"
THP_DEFRAG_ENABLED="1"

# CPU optimizations
CPU_GOVERNOR="schedutil"
CPU_MIN_FREQ="800000"
CPU_MAX_FREQ="3600000"
CPU_TURBO_BOOST="1"

# Available: bfq, none, kyber, deadline, cfq
IO_SCHEDULER="bfq"

# I/O optimizations
READAHEAD_SIZE="4096"
SWAPPINESS="60"
WATERMARK_SCALE_FACTOR="200"

# Filesystem optimizations
FILESYSTEM_TYPE="ext4"
MOUNT_OPTIONS="noatime,nodiratime,errors=remount-ro"

# ==========================================
# PACKAGE CONFIGURATION
# ==========================================

[Packages]
# Package groups
INCLUDE_SECURITY="yes"
INCLUDE_DEVELOPMENT="yes"
INCLUDE_MEDIA="yes"
INCLUDE_OFFICE="yes"

# Package managers
ENABLE_APT="yes"
ENABLE_FLATPAK="yes"
ENABLE_SNAP="yes"
ENABLE_APPIMAGE="yes"

# APT configuration
APT_INSTALL_RECOMMENDS="false"
APT_INSTALL_SUGGESTS="false"
APT_AUTO_CLEAN="true"
APT_CACHE_LIMIT="100000000"

# ==========================================
# NETWORK CONFIGURATION
# ==========================================

[Network]
# Network Manager
NETWORK_MANAGER="NetworkManager"

# DNS configuration
DNS_SERVERS="1.1.1.1, 8.8.8.8"
DNS_CACHE="yes"

# Hostname
HOSTNAME="lightning-linux"

# ==========================================
# USER CONFIGURATION
# ==========================================

[User]
# Default user
DEFAULT_USERNAME="lightning"
DEFAULT_USER_FULLNAME="Lightning Linux User"
DEFAULT_USER_SHELL="/bin/bash"
DEFAULT_USER_GROUPS="sudo,users,netdev,lpadmin,scanner"

# Root password
ROOT_PASSWORD_ENABLED="yes"
ROOT_PASSWORD="lightning"

# ==========================================
# LOCALE AND TIME CONFIGURATION
# ==========================================

[Locale]
LANG="en_US.UTF-8"
LANGUAGE="en_US:en"
LC_ALL="en_US.UTF-8"

# Keyboard
KEYBOARD_MODEL="pc105"
KEYBOARD_LAYOUT="us"
KEYBOARD_VARIANT=""
KEYBOARD_OPTIONS=""

# Timezone
TIMEZONE="America/New_York"
NTP_ENABLED="yes"
NTP_SERVERS="pool.ntp.org"

# ==========================================
# OUTPUT CONFIGURATION
# ==========================================

[Output]
OUTPUT_DIR="build/output"
ISO_NAME="lightning-linux-${DISTRO_VERSION}-${ARCHITECTURE}.iso"
SQUASHFS_NAME="lightning-linux-${DISTRO_VERSION}-${ARCHITECTURE}.squashfs"

# Compression settings
ISO_COMPRESSION="xz"
SQUASHFS_COMPRESSION="xz"
SQUASHFS_BLOCK_SIZE="256K"
SQUASHFS_DICT_SIZE="100%"

# ==========================================
# VIRTUALIZATION CONFIGURATION
# ==========================================

[Virtualization]
# VirtualBox
ENABLE_VBOX_GUEST_UTILS="yes"
ENABLE_VBOX_GUEST_X11="yes"
ENABLE_VBOX_GUEST_DKMS="yes"

# VMware
ENABLE_VMWARE_TOOLS="yes"

# QEMU/KVM
ENABLE_QEMU_GUEST_AGENT="yes"

# WSL2
ENABLE_WSL2_INTEGRATION="yes"

# ==========================================
# SECURITY CONFIGURATION
# ==========================================

[Security]
# Firewall
ENABLE_FIREWALL="yes"
FIREWALL_TYPE="ufw"

# AppArmor
ENABLE_APPARMOR="yes"

# SELinux
ENABLE_SELINUX="no"

# Encryption
ENABLE_FDE="no"
FDE_METHOD="luks2"
FDE_CIPHER="aes-xts-plain64"
FDE_KEY_SIZE="512"
FDE_HASH="sha512"

# ==========================================
# HARDWARE SUPPORT
# ==========================================

[Hardware]
# Graphics
ENABLE_INTEL_GRAPHICS="yes"
ENABLE_AMD_GRAPHICS="yes"
ENABLE_NVIDIA_GRAPHICS="yes"
ENABLE_VIRTIO_GRAPHICS="yes"

# Wireless
ENABLE_WIFI="yes"
ENABLE_BLUETOOTH="yes"

# Input devices
ENABLE_TOUCHPAD="yes"
ENABLE_TOUCHSCREEN="yes"

# Printing
ENABLE_PRINTING="yes"
ENABLE_SCANNING="yes"

# ==========================================
# DEBUGGING CONFIGURATION
# ==========================================

[Debugging]
# Enable debugging
DEBUG_ENABLED="no"
DEBUG_LEVEL="info"

# Log settings
LOG_DIR="/var/log/lightning-linux"
LOG_MAX_SIZE="10M"
LOG_MAX_FILES="5"

# ==========================================
# EXPERIMENTAL FEATURES
# ==========================================

[Experimental]
# Wayland support
ENABLE_WAYLAND="no"

# PipeWire support
ENABLE_PIPEWIRE="no"

# Flatpak system-wide
ENABLE_FLATPAK_SYSTEM="no"

# Immutable OS
ENABLE_IMMUTABLE_OS="no"

# Rolling release
ENABLE_ROLLING_RELEASE="no"

# ==========================================
# CUSTOM SCRIPTS
# ==========================================

[Scripts]
# Post-install scripts
POST_INSTALL_SCRIPTS="scripts/post-install"

# Pre-removal scripts
PRE_REMOVAL_SCRIPTS="scripts/pre-removal"

# Custom hooks
CUSTOM_HOOKS="scripts/hooks"
