# Lightning Linux Build Configuration (FIXED VERSION)
# Part of HarshitOS / Lightning Linux project
# https://github.com/jainh2095-sudo/Linux
# Fixed: Hardcoded paths, missing default values

# ==========================================
# GENERAL CONFIGURATION
# ==========================================

[General]
DISTRO_NAME="Lightning Linux"
DISTRO_VERSION="1.0"
DISTRO_CODENAME="Harshit"
ARCHITECTURE="${ARCH:-x86_64}"  # FIX #6: Use environment variable with default
BUILD_DATE="$(date +%Y-%m-%d)"
BUILD_TIME="$(date +%H:%M:%S)"
MAINTAINER="Harshit Jain (jainh2095-sudo)"
HOMEPAGE="https://github.com/jainh2095-sudo/Linux"

# ==========================================
# KERNEL CONFIGURATION
# ==========================================

[Kernel]
KERNEL_VERSION="6.1.85"
KERNEL_CONFIG="${KERNEL_CONFIG:-config/kernel/config-x86_64}"  # FIX #6: Use environment variable
KERNEL_PATCHES="${KERNEL_PATCHES:-patches/kernel}"  # FIX #7: Added default value
KERNEL_PATCHSET="${KERNEL_PATCHSET:-none}"  # FIX #7: Added default value
KERNEL_COMPRESSION="${KERNEL_COMPRESSION:-xz}"  # FIX #7: Added default value
KERNEL_FLAVOR="${KERNEL_FLAVOR:-generic}"  # FIX #7: Added default value

# Custom kernel patches
# Available: ck, pf, tkg, zen
# FIX #7: Added default value

# Kernel boot parameters
KERNEL_CMDLINE="quiet splash zswap.enabled=1 zswap.compressor=lz4 zswap.max_pool_percent=20 zswap.accept_throttled_writebacks=1 mitigations=off nowatchdog"

# ==========================================
# INIT SYSTEM CONFIGURATION
# ==========================================

[Init]
# Available: openrc, systemd
INIT_SYSTEM="${INIT_SYSTEM:-openrc}"  # FIX #7: Added default value

# OpenRC settings
OPENRC_PARALLEL="${OPENRC_PARALLEL:-YES}"  # FIX #7: Added default value
OPENRC_LOGGER="${OPENRC_LOGGER:-NO}"  # FIX #7: Added default value
OPENRC_DEPEND_STRICT="${OPENRC_DEPEND_STRICT:-NO}"  # FIX #7: Added default value

# systemd settings
SYSTEMD_DEFAULT_TARGET="${SYSTEMD_DEFAULT_TARGET:-graphical.target}"  # FIX #7: Added default value
SYSTEMD_LOG_LEVEL="${SYSTEMD_LOG_LEVEL:-warning}"  # FIX #7: Added default value

# ==========================================
# LIBC CONFIGURATION
# ==========================================

[LibC]
# Available: glibc, musl
LIBC_IMPLEMENTATION="${LIBC_IMPLEMENTATION:-glibc}"  # FIX #7: Added default value

# musl settings
MUSL_VERSION="${MUSL_VERSION:-1.2.4}"  # FIX #7: Added default value
MUSL_OPTIMIZATIONS="${MUSL_OPTIMIZATIONS:--Os -pipe -fomit-frame-pointer}"  # FIX #7: Added default value

# ==========================================
# DESKTOP ENVIRONMENT CONFIGURATION
# ==========================================

[Desktop]
# Available: xfce4, openbox, lxqt, none
DESKTOP_ENVIRONMENT="${DESKTOP_ENVIRONMENT:-xfce4}"  # FIX #7: Added default value

# Display Manager
# Available: lightdm, sddm, gdm3, none
DISPLAY_MANAGER="${DISPLAY_MANAGER:-lightdm}"  # FIX #7: Added default value

# Window Manager
# Available: picom, compton, none
WINDOW_MANAGER="${WINDOW_MANAGER:-picom}"  # FIX #7: Added default value

# Window Manager settings
PICOM_BACKEND="${PICOM_BACKEND:-glx}"  # FIX #7: Added default value
PICOM_VSYNC="${PICOM_VSYNC:-true}"  # FIX #7: Added default value
PICOM_COMPOSITING_CACHE="${PICOM_COMPOSITING_CACHE:-true}"  # FIX #7: Added default value
PICOM_SHADOW="${PICOM_SHADOW:-true}"  # FIX #7: Added default value
PICOM_SHADOW_RADIUS="${PICOM_SHADOW_RADIUS:-8}"  # FIX #7: Added default value
PICOM_SHADOW_OPACITY="${PICOM_SHADOW_OPACITY:-0.5}"  # FIX #7: Added default value

# ==========================================
# PERFORMANCE OPTIMIZATIONS
# ==========================================

[Optimizations]
# Memory optimizations
ENABLE_ZRAM="${ENABLE_ZRAM:-yes}"  # FIX #7: Added default value
ZRAM_SIZE_PERCENT="${ZRAM_SIZE_PERCENT:-50}"  # FIX #7: Added default value
ZRAM_COMPRESSION="${ZRAM_COMPRESSION:-lz4}"  # FIX #7: Added default value
ZRAM_NUM_DEVICES="${ZRAM_NUM_DEVICES:-1}"  # FIX #7: Added default value

ENABLE_ZSWAP="${ENABLE_ZSWAP:-yes}"  # FIX #7: Added default value
ZSWAP_COMPRESSOR="${ZSWAP_COMPRESSOR:-lz4}"  # FIX #7: Added default value
ZSWAP_MAX_POOL_PERCENT="${ZSWAP_MAX_POOL_PERCENT:-20}"  # FIX #7: Added default value
ZSWAP_ACCEPT_THROTTLED_WRITEBACKS="${ZSWAP_ACCEPT_THROTTLED_WRITEBACKS:-1}"  # FIX #7: Added default value

ENABLE_THP="${ENABLE_THP:-yes}"  # FIX #7: Added default value
THP_ENABLED="${THP_ENABLED:-1}"  # FIX #7: Added default value
THP_DEFRAG_ENABLED="${THP_DEFRAG_ENABLED:-1}"  # FIX #7: Added default value

# CPU optimizations
CPU_GOVERNOR="${CPU_GOVERNOR:-schedutil}"  # FIX #7: Added default value
CPU_MIN_FREQ="${CPU_MIN_FREQ:-800000}"  # FIX #7: Added default value
CPU_MAX_FREQ="${CPU_MAX_FREQ:-3600000}"  # FIX #7: Added default value
CPU_TURBO_BOOST="${CPU_TURBO_BOOST:-1}"  # FIX #7: Added default value

# Available: bfq, none, kyber, deadline, cfq
IO_SCHEDULER="${IO_SCHEDULER:-bfq}"  # FIX #7: Added default value

# I/O optimizations
READAHEAD_SIZE="${READAHEAD_SIZE:-4096}"  # FIX #7: Added default value
SWAPPINESS="${SWAPPINESS:-60}"  # FIX #7: Added default value
WATERMARK_SCALE_FACTOR="${WATERMARK_SCALE_FACTOR:-200}"  # FIX #7: Added default value

# Filesystem optimizations
FILESYSTEM_TYPE="${FILESYSTEM_TYPE:-ext4}"  # FIX #7: Added default value
MOUNT_OPTIONS="${MOUNT_OPTIONS:-noatime,nodiratime,errors=remount-ro}"  # FIX #7: Added default value

# ==========================================
# PACKAGE CONFIGURATION
# ==========================================

[Packages]
# Package groups
INCLUDE_SECURITY="${INCLUDE_SECURITY:-yes}"  # FIX #7: Added default value
INCLUDE_DEVELOPMENT="${INCLUDE_DEVELOPMENT:-yes}"  # FIX #7: Added default value
INCLUDE_MEDIA="${INCLUDE_MEDIA:-yes}"  # FIX #7: Added default value
INCLUDE_OFFICE="${INCLUDE_OFFICE:-yes}"  # FIX #7: Added default value

# Package managers
ENABLE_APT="${ENABLE_APT:-yes}"  # FIX #7: Added default value
ENABLE_FLATPAK="${ENABLE_FLATPAK:-yes}"  # FIX #7: Added default value
ENABLE_SNAP="${ENABLE_SNAP:-yes}"  # FIX #7: Added default value
ENABLE_APPIMAGE="${ENABLE_APPIMAGE:-yes}"  # FIX #7: Added default value

# APT configuration
APT_INSTALL_RECOMMENDS="${APT_INSTALL_RECOMMENDS:-false}"  # FIX #7: Added default value
APT_INSTALL_SUGGESTS="${APT_INSTALL_SUGGESTS:-false}"  # FIX #7: Added default value
APT_AUTO_CLEAN="${APT_AUTO_CLEAN:-true}"  # FIX #7: Added default value
APT_CACHE_LIMIT="${APT_CACHE_LIMIT:-100000000}"  # FIX #7: Added default value

# ==========================================
# NETWORK CONFIGURATION
# ==========================================

[Network]
# Network Manager
NETWORK_MANAGER="${NETWORK_MANAGER:-NetworkManager}"  # FIX #7: Added default value

# DNS configuration
DNS_SERVERS="${DNS_SERVERS:-1.1.1.1, 8.8.8.8}"  # FIX #7: Added default value
DNS_CACHE="${DNS_CACHE:-yes}"  # FIX #7: Added default value

# Hostname
HOSTNAME="${HOSTNAME:-lightning-linux}"  # FIX #7: Added default value

# ==========================================
# USER CONFIGURATION
# ==========================================

[User]
# Default user
DEFAULT_USERNAME="${DEFAULT_USERNAME:-lightning}"  # FIX #7: Added default value
DEFAULT_USER_FULLNAME="${DEFAULT_USER_FULLNAME:-Lightning Linux User}"  # FIX #7: Added default value
DEFAULT_USER_SHELL="${DEFAULT_USER_SHELL:-/bin/bash}"  # FIX #7: Added default value
DEFAULT_USER_GROUPS="${DEFAULT_USER_GROUPS:-sudo,users,netdev,lpadmin,scanner}"  # FIX #7: Added default value

# Root password
ROOT_PASSWORD_ENABLED="${ROOT_PASSWORD_ENABLED:-yes}"  # FIX #7: Added default value
ROOT_PASSWORD="${ROOT_PASSWORD:-lightning}"  # FIX #7: Added default value

# ==========================================
# LOCALE AND TIME CONFIGURATION
# ==========================================

[Locale]
LANG="${LANG:-en_US.UTF-8}"  # FIX #7: Added default value
LANGUAGE="${LANGUAGE:-en_US:en}"  # FIX #7: Added default value
LC_ALL="${LC_ALL:-en_US.UTF-8}"  # FIX #7: Added default value

# Keyboard
KEYBOARD_MODEL="${KEYBOARD_MODEL:-pc105}"  # FIX #7: Added default value
KEYBOARD_LAYOUT="${KEYBOARD_LAYOUT:-us}"  # FIX #7: Added default value
KEYBOARD_VARIANT="${KEYBOARD_VARIANT:--}"  # FIX #7: Added default value
KEYBOARD_OPTIONS="${KEYBOARD_OPTIONS:--}"  # FIX #7: Added default value

# Timezone
TIMEZONE="${TIMEZONE:-America/New_York}"  # FIX #7: Added default value
NTP_ENABLED="${NTP_ENABLED:-yes}"  # FIX #7: Added default value
NTP_SERVERS="${NTP_SERVERS:-pool.ntp.org}"  # FIX #7: Added default value

# ==========================================
# OUTPUT CONFIGURATION
# ==========================================

[Output]
# FIX #6: Use relative paths
OUTPUT_DIR="${BUILD_DIR:-build}/output"
ISO_NAME="${ISO_NAME:-lightning-linux-\${DISTRO_VERSION}-\${ARCHITECTURE}.iso}"  # FIX #7: Added default value
SQUASHFS_NAME="${SQUASHFS_NAME:-lightning-linux-\${DISTRO_VERSION}-\${ARCHITECTURE}.squashfs}"  # FIX #7: Added default value

# Compression settings
ISO_COMPRESSION="${ISO_COMPRESSION:-xz}"  # FIX #7: Added default value
SQUASHFS_COMPRESSION="${SQUASHFS_COMPRESSION:-xz}"  # FIX #7: Added default value
SQUASHFS_BLOCK_SIZE="${SQUASHFS_BLOCK_SIZE:-256K}"  # FIX #7: Added default value
SQUASHFS_DICT_SIZE="${SQUASHFS_DICT_SIZE:-100%}"  # FIX #7: Added default value

# ==========================================
# VIRTUALIZATION CONFIGURATION
# ==========================================

[Virtualization]
# VirtualBox
ENABLE_VBOX_GUEST_UTILS="${ENABLE_VBOX_GUEST_UTILS:-yes}"  # FIX #7: Added default value
ENABLE_VBOX_GUEST_X11="${ENABLE_VBOX_GUEST_X11:-yes}"  # FIX #7: Added default value
ENABLE_VBOX_GUEST_DKMS="${ENABLE_VBOX_GUEST_DKMS:-yes}"  # FIX #7: Added default value

# VMware
ENABLE_VMWARE_TOOLS="${ENABLE_VMWARE_TOOLS:-yes}"  # FIX #7: Added default value

# QEMU/KVM
ENABLE_QEMU_GUEST_AGENT="${ENABLE_QEMU_GUEST_AGENT:-yes}"  # FIX #7: Added default value

# WSL2
ENABLE_WSL2_INTEGRATION="${ENABLE_WSL2_INTEGRATION:-yes}"  # FIX #7: Added default value

# ==========================================
# SECURITY CONFIGURATION
# ==========================================

[Security]
# Firewall
ENABLE_FIREWALL="${ENABLE_FIREWALL:-yes}"  # FIX #7: Added default value
FIREWALL_TYPE="${FIREWALL_TYPE:-ufw}"  # FIX #7: Added default value

# AppArmor
ENABLE_APPARMOR="${ENABLE_APPARMOR:-yes}"  # FIX #7: Added default value

# SELinux
ENABLE_SELINUX="${ENABLE_SELINUX:-no}"  # FIX #7: Added default value

# Encryption
ENABLE_FDE="${ENABLE_FDE:-no}"  # FIX #7: Added default value
FDE_METHOD="${FDE_METHOD:-luks2}"  # FIX #7: Added default value
FDE_CIPHER="${FDE_CIPHER:-aes-xts-plain64}"  # FIX #7: Added default value
FDE_KEY_SIZE="${FDE_KEY_SIZE:-512}"  # FIX #7: Added default value
FDE_HASH="${FDE_HASH:-sha512}"  # FIX #7: Added default value

# ==========================================
# HARDWARE SUPPORT
# ==========================================

[Hardware]
# Graphics
ENABLE_INTEL_GRAPHICS="${ENABLE_INTEL_GRAPHICS:-yes}"  # FIX #7: Added default value
ENABLE_AMD_GRAPHICS="${ENABLE_AMD_GRAPHICS:-yes}"  # FIX #7: Added default value
ENABLE_NVIDIA_GRAPHICS="${ENABLE_NVIDIA_GRAPHICS:-yes}"  # FIX #7: Added default value
ENABLE_VIRTIO_GRAPHICS="${ENABLE_VIRTIO_GRAPHICS:-yes}"  # FIX #7: Added default value

# Wireless
ENABLE_WIFI="${ENABLE_WIFI:-yes}"  # FIX #7: Added default value
ENABLE_BLUETOOTH="${ENABLE_BLUETOOTH:-yes}"  # FIX #7: Added default value

# Input devices
ENABLE_TOUCHPAD="${ENABLE_TOUCHPAD:-yes}"  # FIX #7: Added default value
ENABLE_TOUCHSCREEN="${ENABLE_TOUCHSCREEN:-yes}"  # FIX #7: Added default value

# Printing
ENABLE_PRINTING="${ENABLE_PRINTING:-yes}"  # FIX #7: Added default value
ENABLE_SCANNING="${ENABLE_SCANNING:-yes}"  # FIX #7: Added default value

# ==========================================
# DEBUGGING CONFIGURATION
# ==========================================

[Debugging]
# Enable debugging
DEBUG_ENABLED="${DEBUG_ENABLED:-no}"  # FIX #7: Added default value
DEBUG_LEVEL="${DEBUG_LEVEL:-info}"  # FIX #7: Added default value

# Log settings
LOG_DIR="${LOG_DIR:-/var/log/lightning-linux}"  # FIX #7: Added default value
LOG_MAX_SIZE="${LOG_MAX_SIZE:-10M}"  # FIX #7: Added default value
LOG_MAX_FILES="${LOG_MAX_FILES:-5}"  # FIX #7: Added default value

# ==========================================
# EXPERIMENTAL FEATURES
# ==========================================

[Experimental]
# Wayland support
ENABLE_WAYLAND="${ENABLE_WAYLAND:-no}"  # FIX #7: Added default value

# PipeWire support
ENABLE_PIPEWIRE="${ENABLE_PIPEWIRE:-no}"  # FIX #7: Added default value

# Flatpak system-wide
ENABLE_FLATPAK_SYSTEM="${ENABLE_FLATPAK_SYSTEM:-no}"  # FIX #7: Added default value

# Immutable OS
ENABLE_IMMUTABLE_OS="${ENABLE_IMMUTABLE_OS:-no}"  # FIX #7: Added default value

# Rolling release
ENABLE_ROLLING_RELEASE="${ENABLE_ROLLING_RELEASE:-no}"  # FIX #7: Added default value

# ==========================================
# CUSTOM SCRIPTS
# ==========================================

[Scripts]
# Post-install scripts
POST_INSTALL_SCRIPTS="${POST_INSTALL_SCRIPTS:-scripts/post-install}"  # FIX #7: Added default value

# Pre-removal scripts
PRE_REMOVAL_SCRIPTS="${PRE_REMOVAL_SCRIPTS:-scripts/pre-removal}"  # FIX #7: Added default value

# Custom hooks
CUSTOM_HOOKS="${CUSTOM_HOOKS:-scripts/hooks}"  # FIX #7: Added default value
